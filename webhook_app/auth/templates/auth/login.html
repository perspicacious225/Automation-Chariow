{% extends "dashboard/base_auth.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-title">Bon retour 👋</div>
  <div class="auth-subtitle">Connectez-vous à votre espace Digitech Hub</div>

  {% if error %}
  <div style="display:flex;align-items:flex-start;gap:10px;padding:11px 14px;
              background:rgba(226,75,74,0.08);border:0.5px solid rgba(226,75,74,0.3);
              border-radius:8px;margin-bottom:18px;animation:flash-in .3s ease;">
    <i class="ti ti-alert-circle" style="font-size:16px;color:#E24B4A;flex-shrink:0;margin-top:1px;"></i>
    <span style="font-size:12px;color:#F08080;line-height:1.5;">{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" novalidate >

    <div class="auth-field">
      <label class="auth-label" for="email">
        <i class="ti ti-mail" style="font-size:11px;margin-right:3px;"></i>
        Email
      </label>
      <input class="auth-input" id="email" type="email" name="email"
             autocomplete="username" required autofocus
             placeholder="adresse mail"
             value="{{ prefill_email or '' }}">
    </div>

    <div class="auth-field">
      <label class="auth-label" for="password">
        <i class="ti ti-lock" style="font-size:11px;margin-right:3px;"></i>
        Mot de passe
      </label>
      <div class="password-wrap">
        <input class="auth-input" id="password" type="password" name="password"
               autocomplete="current-password" required placeholder="••••••••">
        <button type="button" class="toggle-pass" id="toggleBtn" aria-label="Afficher le mot de passe">
          <i class="ti ti-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="auth-btn">
      <i class="ti ti-login" style="font-size:15px;margin-right:6px;vertical-align:middle;"></i>
      Se connecter
    </button>

  </form>

  <div class="auth-divider"></div>

  <div class="auth-alt">
    Pas de compte ? <a href="{{ url_for('auth.register') }}">Créer un compte</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var btn   = document.getElementById('toggleBtn');
  var input = document.getElementById('password');
  var icon  = document.getElementById('eyeIcon');
  if (btn && input) {
    btn.addEventListener('click', function() {
      var isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      icon.className = isPwd ? 'ti ti-eye-off' : 'ti ti-eye';
      btn.setAttribute('aria-pressed', String(isPwd));
    });
  }
})();
</script>
{% endblock %}
